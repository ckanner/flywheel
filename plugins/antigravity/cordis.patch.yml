# Official local CLI. Presets must also explicitly allow subagent_antigravity.
- insert:
    - id: antigravity
      name: dsh-subagent-antigravity
      config:
        command: agy
        presets: [daily, heavy, cordis]
        model: gemini-4-hydrogen-high
        effort: high
        executionMode: default
        permissionMode: request-review
        sandbox: false
        timeoutMs: 600000
        disposeGraceMs: 2000
