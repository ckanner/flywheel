# Build once, verify the packed candidate on both operating systems, then publish.
# Exact versions become available before latest moves; failed retries verify the
# existing bytes instead of treating an arbitrary npm error as "not published".
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact existing release tag (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

# Companion source is not yet an npm release. Verify the same reviewed bytes
# as PR CI without adding the optional adapter to the complete published package.
env:
  CLAUDE_CODE_PRO_SOURCE_SHA: 54d7eafa9102713597e3b96a6d70a9cbd86afc6b

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.source.outputs.version }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - name: Verify the package version and exact clean release tag
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node scripts/release-preflight.js --tag "$RELEASE_TAG" --json > "$RUNNER_TEMP/flywheel-release.json"
          node - "$RUNNER_TEMP/flywheel-release.json" <<'NODE'
          const fs = require('node:fs');
          const release = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `version=${release.version}\nsource_sha=${release.source_sha}\ntag=${release.tag}\n`);
          NODE

  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - name: Install pinned npm 12.2.1 and report the release toolchain
        run: |
          npm install --global npm@12.2.1 --ignore-scripts
          node --version
          npm --version
      - name: Build the complete package candidate once
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          bash scripts/build-npm.sh "$VERSION" dist-npm
          node scripts/release-publish.js verify-candidate --directory dist-npm --source-sha "$SOURCE_SHA"
      - name: Pack the reviewed optional Claude machine API
        run: |
          claude_source="$RUNNER_TEMP/flywheel-claude-code-pro"
          git init "$claude_source"
          git -C "$claude_source" remote add origin https://github.com/ckanner/dsh-subagent-claude-code-pro.git
          git -C "$claude_source" fetch --depth=1 origin "$CLAUDE_CODE_PRO_SOURCE_SHA"
          git -C "$claude_source" checkout --detach FETCH_HEAD
          test "$(git -C "$claude_source" rev-parse HEAD)" = "$CLAUDE_CODE_PRO_SOURCE_SHA"
          mkdir -p "$GITHUB_WORKSPACE/dist-claude"
          cd "$claude_source"
          npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/dist-claude"
          printf '%s  %s\n' 338675c8fbafc47e7f2c7cc5ffaa6987bda952c5c9c1010ac441230597ce420c "$GITHUB_WORKSPACE/dist-claude/dsh-subagent-claude-code-pro-0.5.0.tgz" | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: npm-candidate-${{ github.run_id }}
          path: dist-npm/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: claude-code-pro-candidate-${{ github.run_id }}
          path: dist-claude/
          if-no-files-found: error

  verify:
    needs: [preflight, build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - name: Install pinned npm 12.2.1 and report the release toolchain
        run: |
          npm install --global npm@12.2.1 --ignore-scripts
          node --version
          npm --version
      - name: Configure Git for isolated tests
        run: |
          git config --global user.email "ci@flywheel.local"
          git config --global user.name "flywheel-ci"
      - name: Go quality gate
        run: make quality-gate
      - uses: actions/download-artifact@v4
        with:
          name: claude-code-pro-candidate-${{ github.run_id }}
          path: dist-claude
      - name: Build and test the DSH plugin
        working-directory: plugins/dsh
        run: |
          npm ci --ignore-scripts
          # npm 12 does not materialize an optional peer with --no-save alone.
          # Install the actual tarball as a temporary dev requirement, then
          # restore source manifests before building or testing the plugin.
          claude_peer_backup="$(mktemp -d "$RUNNER_TEMP/flywheel-claude-peer.XXXXXX")"
          cp package.json "$claude_peer_backup/package.json"
          cp package-lock.json "$claude_peer_backup/package-lock.json"
          trap 'cp "$claude_peer_backup/package.json" package.json; cp "$claude_peer_backup/package-lock.json" package-lock.json; rm -rf "$claude_peer_backup"' EXIT
          npm install --save-dev --ignore-scripts --no-audit --no-fund ../../dist-claude/dsh-subagent-claude-code-pro-0.5.0.tgz
          cp "$claude_peer_backup/package.json" package.json
          cp "$claude_peer_backup/package-lock.json" package-lock.json
          npm run check
          # Missing optional peer must fail this backend gate, never count as a skip.
          node dist/codex-pro-worker.js --doctor
          node dist/claude-code-pro-worker.js --doctor
      - name: Verify Go to Node to SDK, Codex Pro and Claude protocol boundaries (offline)
        env:
          FLYWHEEL_TEST_NODE_BRIDGE: "1"
        run: go test ./internal/drivers -run '^Test(DSH|CodexPro|ClaudeCodePro|KimiNative)NodeWorkerOfflineBridge$' -count=1 -v
      - name: Check concurrent lifecycle and state code
        if: runner.os == 'Linux'
        run: go test -race ./internal/machine ./internal/verify ./internal/watchdog ./internal/drivers ./internal/cli ./internal/modules ./internal/diagnostic -count=1
      - name: Verify npm runtime, installer and release policy
        run: npm test
      - uses: actions/download-artifact@v4
        with:
          name: npm-candidate-${{ github.run_id }}
          path: dist-npm
      - name: Verify candidate identity
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: node scripts/release-publish.js verify-candidate --directory dist-npm --source-sha "$SOURCE_SHA"
      - name: Install and exercise the actual npm candidate
        env:
          FLYWHEEL_NPM_PACKAGES_DIR: ${{ github.workspace }}/dist-npm
          FLYWHEEL_CLAUDE_CODE_PRO_TARBALL: ${{ github.workspace }}/dist-claude/dsh-subagent-claude-code-pro-0.5.0.tgz
        run: npm run test:install
      - name: Build native CLI for paired session evaluation
        run: make build
      - name: Verify all paired session scenarios through the real engine and public adapter (offline)
        env:
          FLYWHEEL_EVAL_BINARY: ${{ github.workspace }}/flywheel
          FLYWHEEL_EVAL_OUTPUT: ${{ runner.temp }}/flywheel-session-evaluation
        run: npm run test:sessions
      - name: Save paired session evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-evaluation-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/flywheel-session-evaluation/results/report.json
          if-no-files-found: warn

  publish:
    needs: [preflight, build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          # npm 12.2.1 supports both publish and dist-tag with OIDC and needs
          # Node >=24.15.0 on the 24.x line. Pin the publication toolchain.
          node-version: "24.22.1"
          registry-url: "https://registry.npmjs.org"
      - name: Install pinned npm 12.2.1 and report the release toolchain
        run: |
          npm install --global npm@12.2.1 --ignore-scripts
          node --version
          npm --version
      - name: Use npm OIDC trusted publishing without a stored token
        run: |
          config="$RUNNER_TEMP/flywheel-trusted-publishing.npmrc"
          : > "$config"
          printf 'NPM_CONFIG_USERCONFIG=%s\n' "$config" >> "$GITHUB_ENV"
          printf 'NODE_AUTH_TOKEN=\n' >> "$GITHUB_ENV"
          echo "npm authentication: OIDC trusted publishing only."
      - name: Refresh source and release refs with GitHub authentication
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 obtains all current remote refs using checkout's
          # short-lived authentication, including for a private repository.
          # Pin HEAD independently so a moved/deleted tag fails preflight.
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: npm-candidate-${{ github.run_id }}
          path: dist-npm
      - name: Confirm the remote tag still identifies the verified source
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          node scripts/release-preflight.js --tag "$RELEASE_TAG"
          node scripts/release-publish.js verify-candidate --directory dist-npm --source-sha "$SOURCE_SHA"
      - name: Publish the complete package without moving latest
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          REPOSITORY_PRIVATE: ${{ toJSON(github.event.repository.private) }}
        run: |
          case "$REPOSITORY_PRIVATE" in
            true) visibility=private ;;
            false) visibility=public ;;
            *) echo "Missing or invalid GitHub repository private flag" >&2; exit 1 ;;
          esac
          node scripts/release-publish.js publish --directory dist-npm --source-sha "$SOURCE_SHA" --repository-visibility "$visibility"
      - name: Install the exact published version from the public registry
        env:
          FLYWHEEL_NPM_VERSION: ${{ needs.preflight.outputs.version }}
        run: npm run test:registry
      - name: Promote the verified package
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: node scripts/release-publish.js promote --directory dist-npm --source-sha "$SOURCE_SHA"
      - name: Verify the registry version and latest tag
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: node scripts/release-publish.js verify-latest --directory dist-npm --source-sha "$SOURCE_SHA"
