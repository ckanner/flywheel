# Build once, verify the packed candidate on both operating systems, then publish.
# Exact versions become available before latest moves; failed retries verify the
# existing bytes instead of treating an arbitrary npm error as "not published".
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact existing release tag (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.source.outputs.version }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify six versions and exact clean release tag
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node scripts/release-preflight.js --tag "$RELEASE_TAG" --json > "$RUNNER_TEMP/flywheel-release.json"
          node - "$RUNNER_TEMP/flywheel-release.json" <<'NODE'
          const fs = require('node:fs');
          const release = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `version=${release.version}\nsource_sha=${release.source_sha}\ntag=${release.tag}\n`);
          NODE

  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build the six-package candidate once
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          bash scripts/build-npm.sh "$VERSION" dist-npm
          node scripts/release-publish.js verify-candidate --directory dist-npm --source-sha "$SOURCE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-candidate-${{ github.run_id }}
          path: dist-npm/
          if-no-files-found: error

  verify:
    needs: [preflight, build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Configure Git for isolated tests
        run: |
          git config --global user.email "ci@flywheel.local"
          git config --global user.name "flywheel-ci"
      - name: Go quality gate
        run: make quality-gate
      - name: Build and test the DSH plugin
        run: |
          npm --prefix plugins/dsh ci --ignore-scripts
          npm --prefix plugins/dsh run check
      - name: Verify the Go to Node to SDK boundary
        env:
          FLYWHEEL_TEST_NODE_BRIDGE: "1"
        run: go test ./internal/drivers -run '^TestDSHNodeWorkerOfflineBridge$' -count=1
      - name: Check concurrent lifecycle and state code
        if: runner.os == 'Linux'
        run: go test -race ./internal/machine ./internal/verify ./internal/watchdog ./internal/drivers ./internal/cli ./internal/modules ./internal/diagnostic -count=1
      - name: Verify npm runtime, installer and release policy
        run: npm test
      - uses: actions/download-artifact@v4
        with:
          name: npm-candidate-${{ github.run_id }}
          path: dist-npm
      - name: Verify candidate identity
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: node scripts/release-publish.js verify-candidate --directory dist-npm --source-sha "$SOURCE_SHA"
      - name: Install and exercise the actual npm candidate
        env:
          FLYWHEEL_NPM_PACKAGES_DIR: ${{ github.workspace }}/dist-npm
        run: npm run test:install

  publish:
    needs: [preflight, build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          # npm 12.2.1 supports both publish and dist-tag with OIDC and needs
          # Node >=24.15.0 on the 24.x line. Pin the publication toolchain.
          node-version: "24.22.1"
          registry-url: "https://registry.npmjs.org"
      - name: Install npm with trusted-publisher dist-tag support
        run: |
          npm install --global npm@12.2.1 --ignore-scripts
          node --version
          npm --version
      - name: Select npm authentication configuration
        env:
          # Read the secret directly, not setup-node's placeholder token.
          FLYWHEEL_PUBLISH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$FLYWHEEL_PUBLISH_TOKEN" ]; then
            echo "npm authentication: OIDC with repository token fallback available."
          else
            config="$RUNNER_TEMP/flywheel-trusted-publishing.npmrc"
            : > "$config"
            printf 'NPM_CONFIG_USERCONFIG=%s\n' "$config" >> "$GITHUB_ENV"
            echo "npm authentication: OIDC trusted publishing, no stored token."
          fi
      - uses: actions/download-artifact@v4
        with:
          name: npm-candidate-${{ github.run_id }}
          path: dist-npm
      - name: Confirm the remote tag still identifies the verified source
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          node scripts/release-preflight.js --tag "$RELEASE_TAG"
          node scripts/release-publish.js verify-candidate --directory dist-npm --source-sha "$SOURCE_SHA"
      - name: Publish exact dependencies, plugin and meta without moving latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: node scripts/release-publish.js publish --directory dist-npm --source-sha "$SOURCE_SHA"
      - name: Install the exact published version from the public registry
        env:
          FLYWHEEL_NPM_VERSION: ${{ needs.preflight.outputs.version }}
        run: npm run test:registry
      - name: Promote verified packages, meta last
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: node scripts/release-publish.js promote --directory dist-npm --source-sha "$SOURCE_SHA"
      - name: Verify all six registry versions and latest tags
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: node scripts/release-publish.js verify-latest --directory dist-npm --source-sha "$SOURCE_SHA"
