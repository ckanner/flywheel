# CI — Go 引擎 + DSH Node worker / 桌面插件。
# 保留 make quality-gate（vet + fmt-check + coverage 100%），并验证插件及跨进程契约。
# 双 OS 矩阵（PR #4 review 起）：本地绿 ≠ CI 绿——PR #4 曾在作者 macOS 全绿、
# Linux CI 红（darwin-only 断言 + 亚毫秒计时脆弱断言）；修复后测试已平台可移植，
# 矩阵再补另一方向：darwin-only 事实（EvalSymlinks /tmp→/private/tmp、zcode
# 桌面注册面）也进 CI，不再依赖开发机。
# skills 规范校验内建于 Go 测试（internal/skillsembed 对全部 SKILL.md 做
# 真 YAML 解析并强制 whenToUse/arguments/metadata.version——取代旧
# skill-format-check.js 纯正则假绿）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# PR CI verifies the reviewed source-pinned Claude candidate; publication separately requires matching registry bytes.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - name: Install pinned npm 12.2.1 and report the release toolchain
        run: |
          npm install --global npm@12.2.1 --ignore-scripts
          node --version
          npm --version
      - name: Build one complete npm candidate
        run: npm run build:npm
      - name: Verify the reviewed Claude machine API candidate
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { readClaudeRelease, verifyArchive } = require('./scripts/claude-release-gate.js');
          const metadata = readClaudeRelease(process.cwd());
          const archive = path.join('plugins/dsh/vendor', metadata.tarball);
          verifyArchive(archive, metadata);
          fs.mkdirSync('dist-claude', { recursive: true });
          fs.copyFileSync(archive, path.join('dist-claude', metadata.tarball));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: npm-candidate
          path: dist-npm/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: claude-code-pro-candidate
          path: dist-claude/
          if-no-files-found: error

  test:
    needs: npm-candidate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - name: Install pinned npm 12.2.1 and report the release toolchain
        run: |
          npm install --global npm@12.2.1 --ignore-scripts
          node --version
          npm --version
      - uses: actions/download-artifact@v4
        with:
          name: npm-candidate
          path: dist-npm
      - uses: actions/download-artifact@v4
        with:
          name: claude-code-pro-candidate
          path: dist-claude
      - name: Install git (worktree tests need a real git)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y git
      - name: Configure git for commit tests
        run: |
          git config --global user.email "ci@flywheel.local"
          git config --global user.name "flywheel-ci"
      - run: make quality-gate
      - name: Build and test the DSH plugin (offline)
        working-directory: plugins/dsh
        run: |
          npm ci --ignore-scripts
          # npm 12 does not materialize an optional peer with --no-save alone.
          # Install the actual tarball as a temporary dev requirement, then
          # restore source manifests before building or testing the plugin.
          claude_peer_backup="$(mktemp -d "$RUNNER_TEMP/flywheel-claude-peer.XXXXXX")"
          cp package.json "$claude_peer_backup/package.json"
          cp package-lock.json "$claude_peer_backup/package-lock.json"
          trap 'cp "$claude_peer_backup/package.json" package.json; cp "$claude_peer_backup/package-lock.json" package-lock.json; rm -rf "$claude_peer_backup"' EXIT
          npm install --save-dev --ignore-scripts --no-audit --no-fund ../../dist-claude/dsh-subagent-claude-code-pro-0.5.2.tgz
          cp "$claude_peer_backup/package.json" package.json
          cp "$claude_peer_backup/package-lock.json" package-lock.json
          npm run check
          # Missing optional peer must fail this backend gate, never count as a skip.
          node dist/codex-pro-worker.js --doctor
          node dist/claude-code-pro-worker.js --doctor
      - name: Verify Go to Node to SDK, Codex Pro and Claude protocol boundaries (offline)
        env:
          FLYWHEEL_TEST_NODE_BRIDGE: "1"
        run: go test ./internal/drivers -run '^Test((DSH|CodexPro|ClaudeCodePro|KimiNative)NodeWorkerOfflineBridge|(DSH|CodexPro|ClaudeCodePro)ProviderActivityOfflineBridge|KimiPrintSessionTitleOfflineBridge|KimiPrintIdentityFailureIsNotRetryableOfflineBridge)$' -count=1 -v
      - name: Verify npm runtime, installer and release contracts
        run: npm test
      - name: Install and exercise the actual npm candidate
        env:
          FLYWHEEL_NPM_PACKAGES_DIR: dist-npm
          FLYWHEEL_CLAUDE_CODE_PRO_TARBALL: ${{ github.workspace }}/dist-claude/dsh-subagent-claude-code-pro-0.5.2.tgz
        run: npm run test:install
      - name: Check concurrent lifecycle and state code
        if: runner.os == 'Linux'
        run: go test -race ./internal/machine ./internal/verify ./internal/watchdog ./internal/drivers ./internal/cli ./internal/modules ./internal/diagnostic -count=1
      - name: Build and exercise the native CLI
        run: |
          make build
          ./flywheel version
          ./flywheel control --help
          ./flywheel doctor --help
          mkdir -p dist/ci
          ./flywheel config inspect --cwd "$PWD" --json > dist/ci/config-inspect.json
          tar -czf dist/ci/flywheel-native.tar.gz flywheel
      - name: Verify all paired session scenarios through the real engine and public adapter (offline)
        env:
          FLYWHEEL_EVAL_BINARY: ${{ github.workspace }}/flywheel
          FLYWHEEL_EVAL_OUTPUT: ${{ runner.temp }}/flywheel-session-evaluation
        run: npm run test:sessions
      - name: Save paired session evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-evaluation-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/flywheel-session-evaluation/results/report.json
          if-no-files-found: warn
      - name: Preserve the same verified complete npm candidate
        run: |
          cp dist-npm/*.tgz dist/ci/
          cp dist-npm/candidate.json dist/ci/
      - name: Save checked development packages
        uses: actions/upload-artifact@v4
        with:
          name: flywheel-${{ runner.os }}-${{ runner.arch }}
          path: dist/ci/
          if-no-files-found: error
