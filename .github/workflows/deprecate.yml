# 手动 npm 弃用维护：使用单独授权的维护凭据，不属于 OIDC 自动发布流程。
# 仅维护主包；历史拆包版本不被单包发行流程改写。
name: deprecate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "要弃用的版本号（如 0.22.0）"
        required: true
      message:
        description: "弃用说明（安装时展示给用户）"
        required: true

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Deprecate the complete Flywheel package
        run: |
          for pkg in "@ckanner/flywheel"; do
            if npm view "$pkg@$VERSION" version >/dev/null 2>&1; then
              npm deprecate "$pkg@$VERSION" "$MESSAGE"
              echo "deprecated: $pkg@$VERSION"
            else
              echo "skip（该版本不存在）: $pkg@$VERSION"
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
          MESSAGE: ${{ inputs.message }}
