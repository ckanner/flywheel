name: Prepare reviewed companion artifacts

on:
  pull_request:
    paths:
      - '.github/workflows/prepare-companion-artifacts.yml'
      - '.github/prepare-companion-artifacts.mjs'

permissions:
  contents: read

concurrency:
  group: companion-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODEX_SOURCE_SHA: 284f12c208d03f3f922ccab8eb8002d3bb950796
      CLAUDE_SOURCE_SHA: 099e247446c9fdb3c43054148cd958ca62028e4c
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Use the established release npm
        run: npm install --global npm@12.2.1 --ignore-scripts
      - uses: actions/checkout@v4
        with:
          repository: ckanner/dsh-subagent-codex-pro
          ref: 284f12c208d03f3f922ccab8eb8002d3bb950796
          path: _companion/codex
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ckanner/dsh-subagent-claude-code-pro
          ref: 099e247446c9fdb3c43054148cd958ca62028e4c
          path: _companion/claude
          persist-credentials: false
      - name: Pack exact sources, resolve locks, verify normal installation and transfer public artifacts
        run: node .github/prepare-companion-artifacts.mjs
